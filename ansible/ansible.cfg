[defaults]
inventory          = inventory/hosts.yml
roles_path         = roles
vault_password_file = ~/.ansible/taskflow_vault_pass
host_key_checking  = False
interpreter_python = /usr/bin/python3
stdout_callback    = default
callback_result_format = yaml
forks              = 3

[ssh_connection]
pipelining = True
# one SSH connection per server for the whole run (UFW allows only 6 new SSH connections / 30 s)
ssh_args   = -o ControlMaster=auto -o ControlPersist=10m -o ServerAliveInterval=30
# a dropped connection (e.g. the moment UFW is enabled) is retried instead of failing the run
retries    = 5
