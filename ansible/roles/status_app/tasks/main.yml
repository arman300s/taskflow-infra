# SIS5: own container image from Docker Hub, run on tf-web behind Nginx
- name: Docker engine and Python SDK for Ansible
  ansible.builtin.apt:
    name: [docker.io, python3-docker]
    state: present
  environment: { NEEDRESTART_SUSPEND: "1" }

- name: Docker enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: taskflow-status container (published on localhost only, Nginx proxies /status/)
  community.docker.docker_container:
    name: taskflow-status
    image: "{{ status_image }}:{{ status_image_tag }}"
    pull: missing
    state: started
    restart_policy: unless-stopped
    published_ports: ["127.0.0.1:{{ status_port }}:8080"]
    env:
      API_URL: "http://tf-app:{{ app_port }}"
      NODES: "{{ groups['all'] | sort | join(',') }}"
    # containers do not read the host /etc/hosts - pass the private names explicitly
    etc_hosts: "{{ dict(groups['all'] | zip(groups['all'] | map('extract', hostvars, 'private_ip'))) }}"
