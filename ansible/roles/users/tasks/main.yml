# SIS2: roles, users, file permissions (ACL), sudoers, SSH key for the bot, sshd hardening
- name: Role groups
  ansible.builtin.group:
    name: "{{ item }}"
  loop: "{{ role_groups }}"

- name: Existing accounts (to know which users are new)
  ansible.builtin.getent:
    database: passwd

- name: Human users (primary group = their role)
  ansible.builtin.user:
    name: "{{ item.name }}"
    group: "{{ item.group }}"
    groups: "{{ item.groups }}"
    comment: "{{ item.comment }}"
    shell: /bin/bash
    create_home: true
  loop: "{{ people }}"
  loop_control: { label: "{{ item.name }}" }

- name: Temporary password, must be changed on first login (only for new users)
  ansible.builtin.shell: |
    echo '{{ item.name }}:{{ temp_password }}' | chpasswd
    chage -d 0 {{ item.name }}
  loop: "{{ people }}"
  loop_control: { label: "{{ item.name }}" }
  when: item.name not in getent_passwd
  no_log: true

- name: Home directories closed to other users
  ansible.builtin.file:
    path: "/home/{{ item.name }}"
    mode: "0750"
  loop: "{{ people }}"
  loop_control: { label: "{{ item.name }}" }

- name: CI/CD bot - no password at all, SSH key only
  ansible.builtin.user:
    name: "{{ automation_user }}"
    group: tf-automation
    comment: TaskFlow CI/CD bot
    shell: /bin/bash
    create_home: true
    password: "*"

- name: Bot home directory mode
  ansible.builtin.file:
    path: "/home/{{ automation_user }}"
    mode: "0750"

- name: Bot public key (private key stays on the laptop)
  ansible.posix.authorized_key:
    user: "{{ automation_user }}"
    key: "{{ automation_pubkey }}"
    exclusive: true

- name: File permissions with ACL (access + default for new files)
  ansible.posix.acl:
    path: "{{ item.0.path }}"
    entity: "{{ item.1.split(':')[0] }}"
    etype: group
    permissions: "{{ item.1.split(':')[1] }}"
    default: "{{ item.2 }}"
    state: present
  loop: "{{ (acl_rules[tf_role] | subelements('entries')) | product([false, true]) | map('flatten') | list }}"
  loop_control: { label: "{{ item.0.path }} {{ item.1 }} {{ 'default' if item.2 else 'access' }}" }
  vars:
    common_acl:
      - { path: "/var/log/{{ app_name }}", entries: ["tf-developers:rx", "tf-auditors:rx"] }
      - { path: "/etc/{{ app_name }}",     entries: ["tf-developers:rx", "tf-auditors:rx"] }
    acl_rules:
      web: "{{ common_acl + [{'path': '/var/www/' ~ app_name, 'entries': ['tf-developers:rwx', 'tf-automation:rwx', 'tf-auditors:rx']}] }}"
      app: "{{ common_acl + [{'path': '/opt/' ~ app_name,     'entries': ['tf-developers:rwx', 'tf-automation:rwx', 'tf-auditors:rx']}] }}"
      db:  "{{ common_acl }}"

- name: Role-based sudo rules (checked with visudo before they are installed)
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/taskflow
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s

- name: SSH hardening (50- is read before the cloud 60- file, first value wins)
  ansible.builtin.template:
    src: sshd_taskflow.conf.j2
    dest: /etc/ssh/sshd_config.d/50-taskflow.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh
